name: scheduled-notify
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: send
        env:
          HOOK: ${{ secrets.WECOM_WEBHOOK }}
        run: |
          sudo timedatectl set-timezone Asia/Shanghai 2>/dev/null || true
          NOW=$(TZ=Asia/Shanghai date +%H:%M)
          python3 notify.py "$NOW"
