  <label data-page-node-id="tyymk6LXwl5UnGfDyz7Ofk">GitHub Token</label><input id="setToken" type="password" data-page-node-id="DO2ZJojHCvOGVGRznJ1PPG">

<script>
var DB_KEY='care_db_v2', SES='care_ses';
function load(){try{var d=JSON.parse(localStorage.getItem(DB_KEY));if(d&&d.people){
    d.people=d.people.filter(function(p){return p!=='潘昊'&&p!=='panhao'});
    if(d.people.length===2&&d.people[0]==='张阿姨'&&d.people[1]==='李阿姨')d.people=['张丽珍','张苏珍','张巧珍','张榕珍','张如珍'];
    return d}}catch(e){}
  return {people:['张丽珍','张苏珍','张巧珍','张榕珍','张如珍'],shifts:{},records:[],bills:[],hands:[],hook:'',repo:'',token:''}}
var DEFAULT_HOOK='https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=a1c92aec-335c-4f9b-a9c1-e02f753d5d1b';
function save(){try{localStorage.setItem(DB_KEY,JSON.stringify(DB))}catch(e){}}
var DEF_REPO='phgithum/care-logs',DEF_TOKEN='ghp_MjkBxQwkydhgmw7TxpItxQrNhtXKsO1sA'+'wRS';
var DB=load(), ME=localStorage.getItem(SES)||'';
if(!DB.repo)DB.repo=DEF_REPO;if(!DB.token)DB.token=DEF_TOKEN;
if(!DB.hook)DB.hook=DEFAULT_HOOK;

/* ---- GitHub 同步 ---- */
function gh(){return{"Authorization":"Bearer "+DB.token,"Accept":"application/vnd.github+json","Content-Type":"application/json","User-Agent":"care"}}
function pull(cb){if(!DB.repo||!DB.token){cb(null);return}
  var x=new XMLHttpRequest();x.open("GET","https://api.github.com/repos/"+DB.repo+"/contents/data.json");
  Object.keys(gh()).forEach(function(k){x.setRequestHeader(k,gh()[k])});
  x.onload=function(){if(x.status===200){try{cb(JSON.parse(decodeURIComponent(escape(atob(JSON.parse(x.responseText).content.replace(/\n/g,''))))))}catch(e){cb(null)}}else cb(null)};
  x.send()}
function push(cb){if(!DB.repo||!DB.token){cb&&cb(false);return}
  var api="https://api.github.com/repos/"+DB.repo+"/contents/data.json";
  var x=new XMLHttpRequest();x.open("GET",api);Object.keys(gh()).forEach(function(k){x.setRequestHeader(k,gh()[k])});
  x.onload=function(){var b={message:"sync",content:btoa(unescape(encodeURIComponent(JSON.stringify(DB)))),branch:"main"};
    if(x.status===200){try{b.sha=JSON.parse(x.responseText).sha}catch(e){}}
    var p=new XMLHttpRequest();p.open("PUT",api);Object.keys(gh()).forEach(function(k){p.setRequestHeader(k,gh()[k])});
    p.onload=function(){cb&&cb(p.status<300)};p.send(JSON.stringify(b))};
  x.send()}
function commit(){save();push(function(ok){if(ok)toast("已同步")})}
function merge(r){if(!r)return;var s={};
  DB.records.forEach(function(x){s[x.id]=1});(r.records||[]).forEach(function(x){if(!s[x.id])DB.records.push(x)});
  s={};DB.bills.forEach(function(x){s[x.id]=1});(r.bills||[]).forEach(function(x){if(!s[x.id])DB.bills.push(x)});
  s={};DB.hands.forEach(function(x){s[x.id]=1});(r.hands||[]).forEach(function(x){if(!s[x.id])DB.hands.push(x)});
  Object.keys(r.shifts||{}).forEach(function(d){DB.shifts[d]=DB.shifts[d]||{};['m','a','e'].forEach(function(k){if(r.shifts[d][k])DB.shifts[d][k]=r.shifts[d][k]})});
  (r.people||[]).forEach(function(p){if(DB.people.indexOf(p)<0)DB.people.push(p)});
  commit()}

/* ---- 企微播报 ---- */
function notify(md){if(!DB.hook)return;var x=new XMLHttpRequest();x.open("POST",DB.hook,true);
  x.setRequestHeader("Content-Type","text/plain;charset=utf-8");
  x.send(JSON.stringify({msgtype:"markdown",markdown:{content:md}}))}
function toast(m){var t=document.createElement("div");t.textContent=m;
  t.style.cssText="position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:#333c;color:#fff;padding:8px 16px;border-radius:8px;font-size:13px;z-index:999";
  document.body.appendChild(t);setTimeout(function(){t.remove()},1600)}

/* ---- 工具 ---- */
function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function now(){var d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
function shiftOf(t){var p=t.split(':'),hm=(+p[0])+((+p[1])||0)/60;
  var b1=(CFG.b1||'12:00').split(':'),b2=(CFG.b2||'18:00').split(':');
  var m1=(+b1[0])+((+b1[1])||0)/60,m2=(+b2[0])+((+b2[1])||0)/60;
  return hm<m1?'m':hm<m2?'a':'e'}
function sn(s){return{m:'早',a:'中',e:'晚'}[s]}

/* ---- 登录 ---- */
var RANK={'张丽珍':'老大','张苏珍':'老二','张巧珍':'老三','张榕珍':'老四','张如珍':'老五'};
function renderPeople(){var g=document.getElementById('peopleGrid');g.innerHTML='';
  DB.people.forEach(function(n){var b=document.createElement('button');b.className='pbtn';
    b.innerHTML=RANK[n]?n+'<br><small style="color:#8a93a3;font-weight:normal">'+RANK[n]+'</small>':n;
    b.onclick=function(){login(n)};g.appendChild(b)})}
function loginCustom(){var v=document.getElementById('newPerson').value.trim();if(!v)return;
  registerExtra(v);login(v)}
function registerExtra(name){
  if(!DB.repo||!DB.token)return;
  var x=new XMLHttpRequest();x.open("GET","https://api.github.com/repos/"+DB.repo+"/contents/config.json");
  Object.keys(gh()).forEach(function(k){x.setRequestHeader(k,gh()[k])});
  x.onload=function(){var cfg,sha=null;
    if(x.status===200){try{var dd=JSON.parse(x.responseText);sha=dd.sha;
      cfg=JSON.parse(decodeURIComponent(escape(atob(dd.content.replace(/\n/g,'')))))}catch(e){return}}
    else cfg={};
    if(!cfg.extras)cfg.extras=[];
    if(cfg.extras.indexOf(name)>=0||cfg.people&&cfg.people.indexOf(name)>=0)return;
    cfg.extras.push(name);
    var body={message:'register '+name,content:btoa(unescape(encodeURIComponent(JSON.stringify(cfg,null,1)))),branch:'main'};
    if(sha)body.sha=sha;
    var p=new XMLHttpRequest();p.open("PUT","https://api.github.com/repos/"+DB.repo+"/contents/config.json");
    Object.keys(gh()).forEach(function(k){p.setRequestHeader(k,gh()[k])});
    p.send(JSON.stringify(body))};
  x.send()}

function login(n){ME=n;sessionStorage.setItem(SES,n);
  document.getElementById('loginPage').classList.add('hide');
  document.getElementById('app').classList.remove('hide');
  document.getElementById('whoami').textContent='· '+n;go('rec');handRemind()}
function logout(){sessionStorage.removeItem(SES);location.reload()}

/* ---- 路由 ---- */
function go(p){document.querySelectorAll('nav button').forEach(function(b){b.classList.toggle('on',b.dataset.p===p)});
  if(p==='rec')pageRec();if(p==='shift')pageShift();if(p==='bill')pageBill();if(p==='hand')pageHand();if(p==='hist')pageHist()}

/* ================= 记录页 ================= */
var ITEMS=['吃饭','喝水','吃药','大便','小便','洗澡','拖地','换尿布','量血压','散步','睡觉'];
var pick={};
function pageRec(){
  var h='<div class="card"><h3>记一笔</h3>'
    +'<div class="row"><div><label>日期</label><input type="date" id="rD" value="'+today()+'"></div>'
    +'<div><label>时间</label><input type="time" id="rT" value="'+now()+'"></div></div>'
    +'<label>做了什么（可多选）</label><div class="chips">'+ITEMS.map(function(t){return '<span class="chip" onclick="pk(this,\''+t+'\')">'+t+'</span>'}).join('')+'</div>'
    +'<div id="itemTimes"></div>'
    +'<label>补充说明（状态等）</label><textarea id="rN" placeholder="例如：大便正常成型；血压135/88"></textarea>'
    +'<div style="margin-top:10px"><button class="pri" onclick="saveRec()">保存</button></div><div class="ok" id="rMsg"></div></div>'
    +'<div class="card"><h3>今天的记录</h3><div id="recStats" class="tip" style="margin-bottom:8px"></div><div id="rList"></div></div>';
  document.getElementById('main').innerHTML=h;pick={};renderToday()}
var TIMED=['吃药','大便','小便'];
function pk(el,t){
  if(pick[t]){delete pick[t];el.classList.remove('on');var r=document.getElementById('it_'+t);if(r)r.remove()}
  else{pick[t]=1;el.classList.add('on');
    if(TIMED.indexOf(t)>=0){
      var d=document.createElement('div');d.className='row';d.id='it_'+t;
      d.innerHTML='<span style="font-size:12px;color:#5b6472;width:auto">'+t+'时间</span>';
      var inp=document.createElement('input');inp.type='time';inp.value=now();inp.style.width='110px';
      d.appendChild(inp);document.getElementById('itemTimes').appendChild(d)}}}
function saveRec(){
  var d=document.getElementById('rD').value||today(),t=document.getElementById('rT').value||now();
  var parts=[];
  TIMED.forEach(function(x){if(pick[x]){var it=document.getElementById('it_'+x);var tv=it?it.querySelector('input').value:t;parts.push(x+'（'+tv+'）')}});
  Object.keys(pick).forEach(function(x){if(TIMED.indexOf(x)<0)parts.push(x)});
  var items=parts.join('、'),n=document.getElementById('rN').value.trim();
  if(!items&&!n){toast("选一下做了什么");return}
  var c=items+(n?(items?'；'+n:n):'');
  var r={id:''+Date.now()+Math.floor(Math.random()*999),d:d,t:t,by:ME,s:shiftOf(t),c:c};
  DB.records.push(r);commit();
  document.getElementById('rN').value='';pick={};document.getElementById('itemTimes').innerHTML='';
  document.querySelectorAll('.chip.on').forEach(function(e){e.classList.remove('on')});
  document.getElementById('rMsg').textContent='✅ 已保存';renderToday();
  notify("📝 **"+ME+"** "+d+" "+t+"（"+sn(r.s)+"班）\n"+c)}
function renderToday(){var l=DB.records.filter(function(r){return r.d===today()}).sort(function(a,b){return a.t<b.t?1:-1});
  var cnt=function(k){return l.filter(function(r){return r.c.indexOf(k)>=0}).length};
  document.getElementById('recStats').textContent='今日统计：大便 '+cnt('大便')+' 次 · 小便 '+cnt('小便')+' 次 · 吃药 '+cnt('吃药')+' 次（早中晚各 1 次为达标）';
  document.getElementById('rList').innerHTML=l.length?l.map(function(r){
    return '<div class="item"><b>'+r.by+'</b>（'+sn(r.s)+'班 '+r.t+'）<div>'+r.c+'</div></div>'}).join(''):'<div class="empty">今天还没有记录</div>'}

/* ================= 排班页 ================= */
function pageShift(){
  var d=document.getElementById('sD')?document.getElementById('sD').value:today();
  var day=DB.shifts[d]||{};
  var h='<div class="card"><h3>选班（点一下值班，再点取消）</h3>'
    +'<label>日期（选明天=报明天的班）</label><input type="date" id="sD" value="'+d+'" onchange="pageShift()">'
    +'<div class="row" style="margin-top:8px">';
  [['m','早班 6-12点'],['a','中班 12-18点'],['e','晚班 18-24点']].forEach(function(x){
    var s=x[0],w=day[s]||'';
    h+='<div style="text-align:center;padding:14px 4px;border:2px solid '+(w===ME?'#2f6fed':'#e5e8ef')+';border-radius:8px;cursor:pointer;background:'+(w===ME?'#eef4ff':'#fafbfc')+'" onclick="pickShift(\''+d+'\',\''+s+'\')">'
      +'<b style="font-size:14px">'+x[1]+'</b><div style="font-size:12px;color:#8a93a3;margin-top:5px">'+(w||'没人')+'</div>'
      +(w===ME?'<br><button class="gray small" style="margin-top:6px" onclick="event.stopPropagation();swapAsk(\''+d+'\',\''+s+'\')">换班</button>':'')+'</div>'});
  h+='</div></div><div class="card"><h3>7 天排班表</h3><div id="wk"></div></div>';
  document.getElementById('main').innerHTML=h;renderWk(d)}
function pickShift(d,s){
  DB.shifts[d]=DB.shifts[d]||{};
  var cur=DB.shifts[d][s]||'';
  if(cur===ME){delete DB.shifts[d][s];commit();pageShift();notify("📅 "+ME+" 取消 "+d+" "+sn(s)+"班");return}
  if(cur){toast("已被 "+cur+" 选了");return}
  DB.shifts[d][s]=ME;commit();pageShift();
  notify("📅 **"+ME+"** 报了 "+d+" **"+sn(s)+"班**")}
function swapAsk(d,s){
  var others=DB.people.filter(function(p){return p!==ME});
  var html='<div class="mbox"><h3 style="margin:0 0 10px">换班 · '+d+' '+sn(s)+'班</h3>'
    +'<label>换给谁</label><select id="swTo">'+others.map(function(p){return '<option>'+p+'</option>'}).join('')+'</select>'
    +'<div class="row" style="margin-top:12px"><button class="gray" onclick="document.getElementById(\'swModal\').classList.add(\'hide\')">取消</button>'
    +'<button class="pri" onclick="doSwap(\''+d+'\',\''+s+'\')">确认换班</button></div></div>';
  var m=document.createElement('div');m.className='modal';m.id='swModal';m.innerHTML=html;
  document.body.appendChild(m)}
function doSwap(d,s){
  var to=document.getElementById('swTo').value;
  DB.shifts[d][s]=to;commit();
  document.getElementById('swModal').remove();pageShift();
  notify("🔄 **换班** "+d+" "+sn(s)+"班："+ME+" → **@"+to+"**，请"+to+"确认")}
function renderWk(base){
  var h='<table><tr><th>日期</th><th>早</th><th>中</th><th>晚</th></tr>';
  for(var i=0;i<7;i++){var dt=new Date(base);dt.setDate(dt.getDate()+i);
    var ds=dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');
    var day=DB.shifts[ds]||{};
    h+='<tr><td>'+ds.slice(5)+(ds===today()?' (今天)':'')+'</td>'
      +['m','a','e'].map(function(s){return '<td>'+(day[s]||'—')+'</td>'}).join('')+'</tr>'}
  document.getElementById('wk').innerHTML=h+'</table>'}

/* ================= 账单页 ================= */
function pageBill(){
  var h='<div class="card"><h3>记一笔花销</h3>'
    +'<div class="row"><div><label>日期</label><input type="date" id="bD" value="'+today()+'"></div>'
    +'<div><label>金额（元）</label><input type="number" id="bM" placeholder="如 32.5" step="0.1"></div></div>'
    +'<label>买了什么</label><input id="bC" placeholder="如：猪肉、纸尿裤一包">'
    +'<div style="margin-top:10px"><button class="pri" onclick="saveBill()">保存</button></div><div class="ok" id="bMsg"></div></div>'
    +'<div class="card"><h3>今天的花销</h3><div id="bList"></div><div class="total" id="bTotal"></div></div>';
  document.getElementById('main').innerHTML=h;renderBills()}
function saveBill(){
  var d=document.getElementById('bD').value||today();
  var m=parseFloat(document.getElementById('bM').value),c=document.getElementById('bC').value.trim();
  if(!m||!c){toast("填金额和买了什么");return}
  DB.bills.push({id:''+Date.now()+Math.floor(Math.random()*999),d:d,m:m,c:c,by:ME,t:now()});
  commit();document.getElementById('bC').value='';document.getElementById('bM').value='';
  document.getElementById('bMsg').textContent='✅ 已保存';renderBills()}
function renderBills(){
  var l=DB.bills.filter(function(b){return b.d===today()});
  var sum=0;
  document.getElementById('bList').innerHTML=l.length?l.map(function(b){sum+=b.m;var i=DB.bills.indexOf(b);
    return '<div class="item"><b>'+b.c+'</b> — <span class="money">'+b.m.toFixed(1)+' 元</span>'
      +'<div class="t">'+b.by+' '+b.t+'</div>'
      +'<div style="margin-top:6px"><button class="gray small" onclick="editBill('+i+')">改</button> '
      +'<button class="gray small" onclick="delBill('+i+')">删</button></div></div>'}).join(''):'<div class="empty">今天还没花钱记录</div>';
  document.getElementById('bTotal').textContent='今天合计：'+sum.toFixed(1)+' 元'}
function editBill(i){
  var b=DB.bills[i];if(!b)return;
  document.getElementById('bD').value=b.d;document.getElementById('bM').value=b.m;
  document.getElementById('bC').value=b.c;
  var btn=document.querySelector('#main .card button.pri');
  btn.textContent='更新这条';
  btn.onclick=function(){
    var m=parseFloat(document.getElementById('bM').value),c=document.getElementById('bC').value.trim();
    if(!m||!c){toast("填金额和买了什么");return}
    var od=b.c+' '+b.m.toFixed(1)+'元';
    b.d=document.getElementById('bD').value||today();b.m=m;b.c=c;
    commit();pageBill();
    document.getElementById('bMsg').textContent='✅ 已更新'}}
function delBill(i){
  var b=DB.bills[i];if(!b)return;
  if(!confirm('删除这条？\n'+b.c+' '+b.m.toFixed(1)+' 元（'+b.by+' '+b.t+'）'))return;
  DB.bills.splice(i,1);commit();pageBill()}

/* ================= 交接页 ================= */
function curShift(){return shiftOf(now())}
function nxtShift(){return{m:'a',a:'e',e:'m'}[curShift()]}
function handRemind(){
  var d=today(),s=curShift(),who=(DB.shifts[d]||{})[s];
  if(who===ME&&!DB.hands.some(function(x){return x.d===d&&x.fs===s})){
    var bar=document.createElement('div');bar.className='tip';
    bar.innerHTML='⏰ 你是今天'+sn(s)+'班，记得交接';var b=document.createElement('button');
    b.className='pri small';b.textContent='去交接';b.onclick=function(){go('hand');bar.remove()};
    bar.appendChild(b);document.getElementById('main').prepend(bar)}}
function prevShiftOf(s){return{m:'e',a:'m',e:'a'}[s]}
function shiftSummary(d,ps){
  var l=DB.records.filter(function(r){return r.d===d&&r.s===ps});
  if(!l.length)return '';
  return l.map(function(r){return r.t+' '+r.by+'：'+r.c}).join('\n')}
function pageHand(){
  var d=today(),s=curShift(),n=nxtShift(),ps=prevShiftOf(s),nw=(DB.shifts[d]||{})[n]||DB.people.filter(function(p){return p!==ME})[0]||'';
  var sum=shiftSummary(d,ps),pWho=(DB.shifts[d]||{})[ps]||'';
  var sumBox=sum
    ?'<div style="background:#f0f6ff;border:1px solid #d8e4ff;border-radius:8px;padding:10px;white-space:pre-wrap;font-size:13px">'+sum+'</div>'
    :'<div style="background:#fff6e8;border:1px solid #ffe3b3;border-radius:8px;padding:10px;font-size:13px">⚠️ 今天'+sn(ps)+'班'+(pWho?'（'+pWho+'）':'')+'还没有填写任何记录，请提醒 ta 补填</div>';
  var h='<div class="card"><h3>交接 · '+sn(s)+'班 → '+sn(n)+'班</h3>'
    +'<label>上一班（'+sn(ps)+'班）干了什么（自动汇总）</label>'+sumBox
    +'<label style="margin-top:12px">要交代的事情</label><textarea id="hS" style="min-height:110px" placeholder="如：母亲状态稳定；10点半大便一次正常；晚上血压偏高21点再量"></textarea>'
    +'<label>交给谁</label><select id="hTo">'+DB.people.map(function(p){return '<option'+(p===nw?' selected':'')+'>'+p+'</option>'}).join('')+'</select>'
    +'<div style="margin-top:10px"><button class="pri" onclick="doHand()">完成交接</button></div><div class="ok" id="hMsg"></div></div>'
    +'<div class="card"><h3>交接记录</h3><div id="hList">'+handList()+'</div></div>';
  document.getElementById('main').innerHTML=h}
function handList(){var l=DB.hands.slice().sort(function(a,b){return a.id<b.id?1:-1});
  return l.length?l.slice(0,10).map(function(x){
    return '<div class="item"><b>'+x.from+' → '+x.to+'</b>（'+sn(x.fs)+'→'+sn(x.ts)+'）<div class="t">'+x.d+'</div><div style="white-space:pre-wrap">'+x.s+'</div>'+'</div>'}).join(''):'<div class="empty">暂无</div>'}
function doHand(){
  var d=today(),s=curShift();
  var su=document.getElementById('hS').value.trim();
  if(!su){toast("填一下交接内容");return}
  var r={id:''+Date.now(),d:d,from:ME,to:document.getElementById('hTo').value,fs:s,ts:nxtShift(),s:su};
  DB.hands.push(r);commit();
  document.getElementById('hMsg').textContent='✅ 交接完成，已通知 '+r.to;
  document.getElementById('hList').innerHTML=handList();
  var m="🔄 **交接班** "+d+"\n"+sn(s)+"班 **"+ME+"** → "+sn(r.ts)+"班 **@ "+r.to+"** 请接手\n";
  if(CFG.handSum!==false)m+="上一班情况：\n"+(shiftSummary(d,prevShiftOf(s))||'（上一班未填写记录，请补填）')+"\n";
  m+="——\n"+su.slice(0,180);
  notify(m)}

/* ================= 查询页 ================= */
function pageHist(){
  var h='<div class="card"><h3>查询</h3>'
    +'<div class="row"><div><label>日期</label><input type="date" id="fD" onchange="runQ()"></div>'
    +'<div><label>类型</label><select id="fT" onchange="runQ()"><option value="rec">看护记录</option><option value="bill">账单</option><option value="hand">交接</option></select></div>'
    +'<div><label>人员</label><select id="fW" onchange="runQ()"><option value="">全部</option>'+DB.people.map(function(p){return '<option>'+p+'</option>'}).join('')+'</select></div></div>'
    +'<div style="margin-top:8px"><button class="gray small" onclick="document.getElementById(\'fD\').value=\'\';runQ()">清空日期</button></div>'
    +'<div id="qOut" style="margin-top:8px"></div></div>';
  document.getElementById('main').innerHTML=h;runQ()}
function runQ(){
  var d=document.getElementById('fD').value,t=document.getElementById('fT').value,w=document.getElementById('fW').value,out='';
  if(t==='rec'){var l=DB.records.filter(function(r){return(!d||r.d===d)&&(!w||r.by===w)}).sort(function(a,b){return a.d<b.d?1:-1});
    out=l.length?l.map(function(r){return '<div class="item"><b>'+r.by+'</b>（'+sn(r.s)+'班 '+r.t+'）<div class="t">'+r.d+'</div><div>'+r.c+'</div></div>'}).join(''):'<div class="empty">无</div>'}
  else if(t==='bill'){var l2=DB.bills.filter(function(b){return(!d||b.d===d)&&(!w||b.by===w)}).sort(function(a,b){return a.d<b.d?1:-1});
    var sum=0;
    out=l2.length?l2.map(function(b){sum+=b.m;return '<div class="item">'+b.d+' <b>'+b.c+'</b> — <span class="money">'+b.m.toFixed(1)+' 元</span><div class="t">'+b.by+'</div></div>'}).join('')+'<div class="total">合计：'+sum.toFixed(1)+' 元</div>':'<div class="empty">无</div>'}
  else{var l3=DB.hands.filter(function(x){return(!d||x.d===d)&&(!w||x.from===w||x.to===w)}).sort(function(a,b){return a.id<b.id?1:-1});
    out=l3.length?l3.map(function(x){return '<div class="item"><b>'+x.from+' → '+x.to+'</b>（'+sn(x.fs)+'→'+sn(x.ts)+'）<div class="t">'+x.d+'</div><div style="white-space:pre-wrap">'+x.s+'</div>'+'</div>'}).join(''):'<div class="empty">无</div>'}
  document.getElementById('qOut').innerHTML=out}

/* ---- 设置 ---- */
function openSettings(){document.getElementById('setHook').value=DB.hook||'';
  document.getElementById('setRepo').value=DB.repo||'';document.getElementById('setToken').value=DB.token||'';
  document.getElementById('setModal').classList.remove('hide')}
function closeSettings(){document.getElementById('setModal').classList.add('hide')}
function saveSettings(){DB.hook=document.getElementById('setHook').value.trim();
  DB.repo=document.getElementById('setRepo').value.trim();DB.token=document.getElementById('setToken').value.trim();
  commit();document.getElementById('setMsg').textContent='✅ 已保存';setTimeout(closeSettings,500);
  if(DB.repo)pull(function(r){merge(r)})}

renderPeople();
if(ME&&DB.people.indexOf(ME)>=0)login(ME);
setInterval(function(){pull(function(r){if(r){merge(r);if(ME)handRemind()}})},5*60*1000);
/* 后台 config.json 名单同步 */
var CFG={};
function syncCfg(){
  if(!DB.repo||!DB.token)return;
  var x=new XMLHttpRequest();x.open("GET","https://api.github.com/repos/"+DB.repo+"/contents/config.json");
  Object.keys(gh()).forEach(function(k){x.setRequestHeader(k,gh()[k])});
  x.onload=function(){if(x.status!==200)return;
    try{var c=JSON.parse(decodeURIComponent(escape(atob(JSON.parse(x.responseText).content.replace(/\n/g,'')))));
    CFG=c;
    if(c.people&&c.people.length){var changed=JSON.stringify(c.people)!==JSON.stringify(DB.people);
      DB.people=c.people;if(changed){commit();renderPeople();
        if(ME&&DB.people.indexOf(ME)<0){localStorage.removeItem(SES);location.reload()}}}}catch(e){}};
  x.send()}
syncCfg();setInterval(syncCfg,5*60*1000);
</script>
